name: release

on:
  push:
    branches:
      - "*"

jobs:
  publish-pact-contracts:
    runs-on: ubuntu-20.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '^1.20.0'
    - uses: replicatedhq/action-install-pact@main
    - name: Publish pact contracts
      run: |
        set -x
        pact-broker --help

